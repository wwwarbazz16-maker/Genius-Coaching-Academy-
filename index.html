<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only"><meta name="description" content="Genius Coaching Academy, Peshawar: English, Maths, Science, Play Group to 7th, Calligraphy, App and Web Development.">
<title>Genius Coaching Academy – Peshawar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&family=Gulzar&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--tint:#f2f6ff;--sf:#fff;--tx:#14213d;--mu:#4f5b73;--bl:#1e6fd9;--or:#f58220;--rd:#e53935;--pu:#9c5bb5;--ye:#f9c21a;--te:#3fb0b0;--ln:#e3e8f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{height:100%;scroll-behavior:smooth;scroll-padding-top:70px;background:#fff}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.65 Nunito,system-ui,sans-serif;overflow-x:hidden}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select{font-family:Gulzar,"Noto Nastaliq Urdu",serif;line-height:2.05;font-weight:400}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.15;margin:0}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:Gulzar,"Noto Nastaliq Urdu",serif;line-height:1.8;font-weight:400}
a{color:inherit}img{max-width:100%;display:block}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1080px;margin:auto;padding:0 18px}
section{padding:64px 0}
h2{font-size:clamp(28px,6vw,42px);margin-bottom:10px}
.sub{color:var(--mu);max-width:560px;margin:0 0 28px}
#bar{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--bl),var(--or),var(--rd),var(--pu),var(--ye));z-index:60}
#gate{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity .5s,visibility .5s}
#gate.off{opacity:0;visibility:hidden}
#gate img{width:min(260px,70vw)}#gate p{margin:0;font-weight:800;font-size:18px}
.lg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{border:0;cursor:pointer;font:800 16px Nunito,sans-serif;padding:14px 28px;border-radius:14px;color:#fff;background:var(--bl);text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 20px -8px var(--bl)}
.btn:hover{transform:translateY(-2px)}.btn.or{background:var(--or);box-shadow:0 8px 20px -8px var(--or)}.btn.gh{background:#fff;color:var(--tx);border:2px solid var(--ln);box-shadow:none}
[dir=rtl] .btn{font-family:Gulzar,serif;font-weight:400}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:10px;height:58px}
header img{height:40px}
nav{display:flex;gap:18px;margin-inline-start:auto;font-weight:700;font-size:15px}
nav a{text-decoration:none;color:var(--mu)}nav a:hover{color:var(--bl)}
.ic{border:1px solid var(--ln);background:#fff;color:var(--tx);border-radius:10px;height:38px;padding:0 14px;cursor:pointer;font-weight:800}
@media(max-width:760px){nav{display:none}header .wrap{justify-content:space-between}}
#hero{padding:50px 0 30px;position:relative;overflow:hidden}
.au{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;animation:fl 14s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(40px,30px) scale(1.15)}}
#hero .wrap{position:relative}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}@keyframes sp{to{--a:360deg}}@keyframes bob{50%{translate:0 -8px}}
.hl{display:block;width:fit-content;margin-bottom:22px;animation:bob 5s ease-in-out infinite;transition:transform .15s;will-change:transform}
.wl{margin:0 0 6px;font:800 clamp(18px,4.5vw,24px) "Baloo 2",Gulzar,sans-serif;color:var(--or)}[dir=rtl] .wl{font-family:Gulzar,serif;font-weight:400}
.hl img{width:min(290px,76vw);mix-blend-mode:multiply}
.tiles b{font:800 clamp(34px,10vw,58px)/1 "Baloo 2",sans-serif;color:#fff;width:clamp(46px,13vw,72px);height:clamp(54px,15vw,84px);display:grid;place-items:center;border-radius:8px;transition:transform .15s;box-shadow:0 8px 0 rgba(0,0,0,.12)}
#hero h1{font-size:clamp(36px,8.5vw,68px);max-width:760px}
.lead{font-size:19px;color:var(--mu);max-width:540px;margin:16px 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.trust span{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--ln);border-radius:99px;padding:7px 16px 7px 12px;font-weight:700;font-size:15px}
.trust svg{color:var(--bl);font-size:20px}
.mi{display:flex;gap:10px;align-items:center;margin:20px 0 0;font-weight:800;color:var(--bl)}.mi svg{font-size:22px;flex:none}
.mq{direction:ltr;overflow:hidden;background:var(--tx);color:#fff;padding:14px 0;margin:34px 0 0;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq div{display:flex;gap:44px;width:max-content;animation:mq 30s linear infinite;font:700 20px "Baloo 2",Gulzar,sans-serif}
.mq i{font-style:normal;white-space:nowrap}.mq i:nth-child(5n+1){color:var(--ye)}.mq i:nth-child(5n+2){color:var(--te)}.mq i:nth-child(5n+3){color:#ff9d4d}.mq i:nth-child(5n+4){color:#ff7b78}
@keyframes mq{to{transform:translateX(-50%)}}
.bento{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{--x:50%;--y:0%;position:relative;background:radial-gradient(260px circle at var(--x) var(--y),color-mix(in srgb,var(--c) 14%,#fff),#fff 70%);border:1px solid var(--ln);border-radius:22px;padding:22px;box-shadow:0 14px 30px -22px rgba(20,33,61,.35)}
.card.wide{grid-column:1/-1}
.ico{width:46px;height:46px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:24px;margin-bottom:12px}
.card h3{font-size:24px;margin-bottom:4px}.card p{margin:0 0 12px;color:var(--mu)}
.bd{display:inline-block;background:var(--c);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:800;margin-bottom:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{border:2px solid var(--ln);background:#fff;color:var(--tx);border-radius:12px;padding:8px 14px;font:800 14px Nunito,sans-serif;cursor:pointer;transition:.15s}
[dir=rtl] .tab{font-family:Gulzar,serif;font-weight:400;font-size:16px}
.tab[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.pn{background:#fff;border:1px dashed var(--c);border-radius:14px;padding:14px 16px;min-height:104px;font-weight:600}
.path{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.path .tab{position:relative}
.tg{display:flex;flex-wrap:wrap;gap:6px}.tg i{font-style:normal;font-size:14px;font-weight:700;background:color-mix(in srgb,var(--c) 14%,#fff);padding:2px 12px;border-radius:99px}
#find{background:var(--tint)}
.fq{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.fq button{background:#fff;color:var(--tx);border:2px solid var(--ln);border-radius:14px;padding:14px;font:700 16px Nunito,sans-serif;cursor:pointer;transition:.15s}
[dir=rtl] .fq button{font-family:Gulzar,serif;font-weight:400}
.fq button:hover{border-color:var(--bl)}.fq button[aria-pressed=true]{background:var(--bl);border-color:var(--bl);color:#fff}
#res{margin-top:16px;padding:18px;border-radius:14px;background:#fff;border-inline-start:6px solid var(--or);min-height:96px;font-weight:700}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.why div{padding:20px;border-radius:18px;background:#fff;border:1px solid var(--ln)}.why .ico{width:42px;height:42px;font-size:22px}.why h3{font-size:21px}.why p{margin:6px 0 0;color:var(--mu)}
.tc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.t{background:#fff;border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.t img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top}
.t div{padding:14px 16px}.t h3{font-size:22px}.t span{color:var(--mu);font-size:15px}
.br{display:grid;grid-template-columns:1fr 1fr;gap:14px}.br div{padding:22px;border-radius:16px;color:#fff;font-weight:800;font-size:18px;text-align:center}
@media(max-width:520px){.br{grid-template-columns:1fr}}
form{display:grid;gap:12px;max-width:520px}
input,select{width:100%;padding:14px;border-radius:12px;border:2px solid var(--ln);background:#fff;color:var(--tx);font:600 16px Nunito,sans-serif}
.ph a{display:block;font:800 24px "Baloo 2",sans-serif;text-decoration:none;color:var(--bl);margin:4px 0}
footer{padding:28px 0 90px;text-align:center;color:var(--mu);font-size:14px;border-top:1px solid var(--ln)}
#fab{position:fixed;inset-inline-end:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:40}
#fab a{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
